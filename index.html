<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CopyPasta</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div class="add-section">
      <button id="color-picker" title="Changer la couleur"></button>
      <textarea id="snippet-input" placeholder="Collez votre texte ici..." rows="2"></textarea>
      <button id="add-btn">Ajouter</button>
    </div>

    <div id="snippet-list"></div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite">Copié !</div>
  </div>

  <template id="bin-icon-template">
    <svg class="bin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </svg>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
