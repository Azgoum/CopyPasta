<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CopyPasta</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div class="add-section">
      <button id="color-picker" title="Changer la couleur"></button>
      <textarea id="snippet-input" placeholder="Collez votre texte ici..." rows="2"></textarea>
      <button id="add-btn">Ajouter</button>
    </div>

    <div id="snippet-list"></div>

    <div id="toast" class="toast hidden">Copié !</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
